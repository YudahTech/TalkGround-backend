# Render Blueprint — Nest API + external Postgres (Neon recommended)
# Docs: https://render.com/docs/blueprint-spec
# Set DATABASE_URL (and other secrets) in the Render dashboard after first create.

services:
  - type: web
    name: talkground-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma@5.22.0 generate && npm run build
    startCommand: npx prisma@5.22.0 migrate deploy && npm run start:prod
    healthCheckPath: /api/v1/home
    envVars:
      - key: NODE_VERSION
        value: "20"
      # PRD v2.5 §7.1: 15 minutes or less (the API also caps it at 15m).
      - key: JWT_EXPIRES_IN
        value: "15m"
      # Testing only: returns SMS codes in API responses. Set "false" once TERMII_API_KEY is configured.
      - key: OTP_DEV_MODE
        value: "true"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: EMAIL_FROM_NAME
        value: "TalkGround"
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional on-demand revalidation of server-rendered pages (PRD §7.13)
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
